services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your shell or local .env file}
      WOT_MODEL: ${WOT_MODEL:-gpt-5.6-sol}
      WOT_DATABASE_PATH: /app/data/wot.db
      WOT_ALLOWED_ORIGINS: http://localhost:8000
    volumes:
      - wot-data:/app/data
    restart: unless-stopped

volumes:
  wot-data:
